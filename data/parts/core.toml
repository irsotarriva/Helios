# On rails a vessel keeps its +z along the orbit's normal, so its -y is away from the body below:
# the pilot sits with that as "up", and the ground is under the floor.
[part.cockpit]
eye_m = [0.1, -0.15, 0.0]
forward = [1.0, 0.0, 0.0]
up = [0.0, -1.0, 0.0]
boxes = [
  { centre_m = [0.0, 0.0, -0.95], size_m = [1.5, 1.3, 0.04], colour = [0.22, 0.23, 0.26] },     # floor
  { centre_m = [0.65, 0.0, -0.38], size_m = [0.04, 1.2, 0.5], colour = [0.30, 0.31, 0.34] },    # panel
  { centre_m = [0.30, 0.48, -0.45], size_m = [0.5, 0.18, 0.04], colour = [0.30, 0.31, 0.34] },  # console
  { centre_m = [0.72, 0.62, 0.15], size_m = [0.05, 0.05, 1.0], colour = [0.40, 0.41, 0.44] },   # pillars
  { centre_m = [0.72, -0.62, 0.15], size_m = [0.05, 0.05, 1.0], colour = [0.40, 0.41, 0.44] },
  { centre_m = [0.72, 0.0, 0.65], size_m = [0.05, 1.29, 0.05], colour = [0.40, 0.41, 0.44] },
