# A room to move about in: 2.6 m each way, with a place to stand at the controls. It is built
# for a vessel that stands on its tail: the floor is towards the tail, so the pilot stands on it
# on the ground and under thrust, and floats in it in free fall. Windows are glass boxes: they
# stop a body and are not drawn.
[[part]]
id = "core.habitat"
name = "Habitat"
dry_mass_kg = 2500.0
shape = { kind = "cylinder", radius_m = 2.0, length_m = 3.0 }
interfaces = ["attitude"]
inputs = [
  { name = "roll", minimum = -1.0, maximum = 1.0, default = 0.0 },
  { name = "pitch", minimum = -1.0, maximum = 1.0, default = 0.0 },
  { name = "yaw", minimum = -1.0, maximum = 1.0, default = 0.0 },
]
