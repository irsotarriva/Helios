# Stock parts: hand-written datasheets (BRIEFING §10, D22). The format is described in README.md.
# All quantities are SI. A vessel's +x axis points to its nose, and so does a part's unless it is
# mounted turned.

# --- Resources ---------------------------------------------------------------------------------

[[resource]]
id = "rp1"
name = "RP-1"
unit = "kg"
mass_per_unit_kg = 1.0

[[resource]]
id = "lox"
name = "Liquid oxygen"
unit = "kg"
mass_per_unit_kg = 1.0

[[resource]]
id = "xenon"
name = "Xenon"
unit = "kg"
mass_per_unit_kg = 1.0

[[resource]]
id = "electric_charge"
name = "Electric charge"
unit = "J"
mass_per_unit_kg = 0.0

# --- Interfaces --------------------------------------------------------------------------------
# What a part must offer to be handled as one of these, whatever it is inside.

[[interface]]
id = "engine"
inputs = ["ignition", "throttle"]
outputs = ["thrust_n", "mass_flow_kg_s"]

[[interface]]
id = "separator"
inputs = ["separate"]

# Something that turns the vessel about its own axes: roll about x (the nose), pitch about y,
# yaw about z, each from -1 to 1 with positive torque about the positive axis. The attitude
# hold commands these.
[[interface]]
id = "attitude"
inputs = ["roll", "pitch", "yaw"]

# --- Parts -------------------------------------------------------------------------------------

# Avionics, a battery and three reaction wheels (1.5 kN m each, 200 W at full torque).
[[part]]
id = "core.probe_core"
name = "Probe core"
dry_mass_kg = 250.0
shape = { kind = "cylinder", radius_m = 0.6, length_m = 0.8 }
interfaces = ["attitude"]
inputs = [
  { name = "roll", minimum = -1.0, maximum = 1.0, default = 0.0 },
  { name = "pitch", minimum = -1.0, maximum = 1.0, default = 0.0 },
  { name = "yaw", minimum = -1.0, maximum = 1.0, default = 0.0 },
]
stores = [{ resource = "electric_charge", capacity = 3.6e6 }] # 1 kWh

[[part.process]]
name = "wheel_roll"
level = "roll"
consumes = [{ resource = "electric_charge", rate_per_s = 200.0 }]
torque_n_m = [1500.0, 0.0, 0.0]

[[part.process]]
name = "wheel_pitch"
level = "pitch"
consumes = [{ resource = "electric_charge", rate_per_s = 200.0 }]
torque_n_m = [0.0, 1500.0, 0.0]

[[part.process]]
name = "wheel_yaw"
level = "yaw"
consumes = [{ resource = "electric_charge", rate_per_s = 200.0 }]
torque_n_m = [0.0, 0.0, 1500.0]

[[part.output]]
name = "charge_fraction"
store = "electric_charge"
quantity = "fraction"

[[part]]
id = "core.solar_panel"
name = "Solar panel"
dry_mass_kg = 20.0
inputs = [{ name = "deployed", toggle = true, default = 1.0 }]

[[part.process]]
name = "generate"
enable = "deployed"
produces = [{ resource = "electric_charge", rate_per_s = 6000.0 }]

[[part.output]]
name = "generating"
process = "generate"
quantity = "level"

[[part]]
id = "core.tank_kerolox_small"
name = "Kerolox tank (4 t)"
dry_mass_kg = 400.0
shape = { kind = "cylinder", radius_m = 0.6, length_m = 3.2 }
stores = [
  { resource = "rp1", capacity = 1200.0 },
  { resource = "lox", capacity = 2800.0 },
]

[[part.output]]
name = "rp1_kg"
unit = "kg"
store = "rp1"
quantity = "amount"

[[part.output]]
name = "lox_kg"
unit = "kg"
store = "lox"
quantity = "amount"

[[part]]
id = "core.tank_kerolox_large"
name = "Kerolox tank (18 t)"
dry_mass_kg = 1500.0
shape = { kind = "cylinder", radius_m = 1.0, length_m = 5.2 }
stores = [
  { resource = "rp1", capacity = 5400.0 },
  { resource = "lox", capacity = 12600.0 },
]

[[part.output]]
name = "rp1_kg"
unit = "kg"
store = "rp1"
quantity = "amount"

[[part.output]]
name = "lox_kg"
unit = "kg"
store = "lox"
quantity = "amount"

# 30 kN, exhaust velocity 3333 m/s (Isp 340 s), throttles down to 40 %.
[[part]]
id = "core.engine_kerolox_vacuum"
name = "Kerolox vacuum engine (30 kN)"
dry_mass_kg = 180.0
shape = { kind = "cylinder", radius_m = 0.5, length_m = 1.2 }
interfaces = ["engine"]
inputs = [
  { name = "ignition", toggle = true },
  { name = "throttle" },
]

[[part.process]]
name = "burn"
enable = "ignition"
level = "throttle"
minimum_level = 0.4
consumes = [
  { resource = "rp1", rate_per_s = 2.7 },
  { resource = "lox", rate_per_s = 6.3 },
]
thrust_n = 30000.0
thrust_position_m = [-0.6, 0.0, 0.0]

[[part.output]]
name = "thrust_n"
unit = "N"
process = "burn"
quantity = "thrust"

[[part.output]]
name = "mass_flow_kg_s"
unit = "kg/s"
process = "burn"
quantity = "mass_flow"

[[part.output]]
name = "chamber_temperature_k"
unit = "K"
process = "burn"
curve = [[0.0, 290.0], [0.4, 3350.0], [1.0, 3600.0]]

# 300 kN, exhaust velocity 3061 m/s (Isp 312 s), throttles down to 60 %.
[[part]]
id = "core.engine_kerolox_booster"
name = "Kerolox booster engine (300 kN)"
dry_mass_kg = 1100.0
shape = { kind = "cylinder", radius_m = 0.9, length_m = 2.0 }
interfaces = ["engine"]
inputs = [
  { name = "ignition", toggle = true },
  { name = "throttle" },
]

[[part.process]]
name = "burn"
enable = "ignition"
level = "throttle"
minimum_level = 0.6
consumes = [
  { resource = "rp1", rate_per_s = 29.4 },
  { resource = "lox", rate_per_s = 68.6 },
]
thrust_n = 300000.0
thrust_position_m = [-1.0, 0.0, 0.0]

[[part.output]]
name = "thrust_n"
unit = "N"
process = "burn"
quantity = "thrust"

[[part.output]]
name = "mass_flow_kg_s"
unit = "kg/s"
process = "burn"
quantity = "mass_flow"

[[part.output]]
name = "chamber_temperature_k"
unit = "K"
process = "burn"
curve = [[0.0, 290.0], [0.6, 3400.0], [1.0, 3650.0]]

# 16 kN, exhaust velocity 3042 m/s (Isp 310 s), throttles down to 10 %: enough range to hover
# a small lander on the Moon.
[[part]]
id = "core.engine_lander"
name = "Lander engine (16 kN)"
dry_mass_kg = 120.0
shape = { kind = "cylinder", radius_m = 0.4, length_m = 0.9 }
interfaces = ["engine"]
inputs = [
  { name = "ignition", toggle = true },
  { name = "throttle" },
]

[[part.process]]
name = "burn"
enable = "ignition"
level = "throttle"
minimum_level = 0.1
consumes = [
  { resource = "rp1", rate_per_s = 1.58 },
  { resource = "lox", rate_per_s = 3.68 },
]
thrust_n = 16000.0
thrust_position_m = [-0.45, 0.0, 0.0]

[[part.output]]
name = "thrust_n"
unit = "N"
process = "burn"
quantity = "thrust"

[[part.output]]
name = "mass_flow_kg_s"
unit = "kg/s"
process = "burn"
quantity = "mass_flow"

# A wide, low ring to stand on. It takes a harder landing than the rest of the vessel would.
[[part]]
id = "core.landing_legs"
name = "Landing legs"
dry_mass_kg = 80.0
shape = { kind = "cylinder", radius_m = 1.8, length_m = 0.3 }
impact_tolerance_m_s = 8.0

# Lets go of its parent and leaves with everything attached below it. No crossfeed: the stage
# below does not drain the tanks above.
[[part]]
id = "core.decoupler"
name = "Stack decoupler"
dry_mass_kg = 60.0
shape = { kind = "cylinder", radius_m = 1.0, length_m = 0.3 }
interfaces = ["separator"]
crossfeed = false
inputs = [{ name = "separate", toggle = true }]
separator = { input = "separate", impulse_n_s = 2500.0 }

[[part]]
id = "core.tank_xenon"
name = "Xenon tank (120 kg)"
dry_mass_kg = 30.0
shape = { kind = "cylinder", radius_m = 0.3, length_m = 0.6 }
stores = [{ resource = "xenon", capacity = 120.0 }]

[[part.output]]
name = "xenon_kg"
unit = "kg"
store = "xenon"
quantity = "amount"

# 0.25 N at 5 kW, exhaust velocity 29 400 m/s (Isp 3000 s): an engine that needs two resources.
[[part]]
id = "core.ion_thruster"
name = "Ion thruster (0.25 N)"
dry_mass_kg = 25.0
shape = { kind = "cylinder", radius_m = 0.2, length_m = 0.3 }
interfaces = ["engine"]
inputs = [
  { name = "ignition", toggle = true },
  { name = "throttle" },
]

[[part.process]]
name = "burn"
enable = "ignition"
level = "throttle"
minimum_level = 0.2
consumes = [
  { resource = "xenon", rate_per_s = 8.5e-6 },
  { resource = "electric_charge", rate_per_s = 5000.0 },
]
thrust_n = 0.25
thrust_position_m = [-0.15, 0.0, 0.0]

[[part.output]]
name = "thrust_n"
unit = "N"
process = "burn"
quantity = "thrust"

[[part.output]]
name = "mass_flow_kg_s"
unit = "kg/s"
process = "burn"
quantity = "mass_flow"
